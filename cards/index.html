<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0b0d12">
<title>JFNB 카드뉴스</title>
<!--
  JFNB 카드뉴스 — 브리핑을 한 장씩 넘겨 보는 화면 (2026-10-10)
  · 발행 파이프라인은 건드리지 않는다. 이미 발행된 ../list.json 과 ../archive/<날짜>.html 을
    브라우저가 읽어 카드로 바꾼다 → 지난 브리핑도, 앞으로 나올 브리핑도 자동으로 카드가 된다.
  · 이 폴더만 따로 앱으로 설치된다 (manifest 의 scope 가 ./ — 브리핑 사이트 전체와 별개의 앱).
  · 방문자 카운터는 넣지 않았다.
-->
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="../icons/icon-192x192.png">
<link rel="apple-touch-icon" href="../icons/icon-192x192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="브리핑 카드">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root { --bg: #0b0d12; --ink: #f4f5f7; --dim: #a3a8b4; --line: rgba(255,255,255,.12); --acc: #ff4d4d; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: Pretendard, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
  body { overscroll-behavior: none; }
  a { color: inherit; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }

  /* ── 목록 ── */
  #list { min-height: 100dvh; padding: calc(env(safe-area-inset-top) + 18px) 16px calc(env(safe-area-inset-bottom) + 32px); max-width: 720px; margin: 0 auto; }
  .brand { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin: 4px 2px 18px; }
  .brand h1 { margin: 0; font-size: 26px; font-weight: 900; letter-spacing: -.02em; }
  .brand h1 b { color: var(--acc); }
  .brand a { font-size: 13px; color: var(--dim); text-decoration: none; }
  #install { display: none; width: 100%; margin: 0 0 16px; padding: 12px; border-radius: 12px; background: #1b1f29; border: 1px solid var(--line); font-weight: 700; }
  .tile { position: relative; display: block; width: 100%; text-align: left; margin: 0 0 14px; padding: 22px 20px 20px; border-radius: 20px; overflow: hidden; min-height: 168px;
    background: linear-gradient(135deg, var(--c1), var(--c2)); box-shadow: 0 10px 30px rgba(0,0,0,.35); }
  .tile .num { position: absolute; right: -8px; bottom: -28px; font-size: 120px; font-weight: 900; letter-spacing: -.06em; color: rgba(255,255,255,.13); line-height: 1; pointer-events: none; }
  .tile .d { font-size: 13px; font-weight: 800; letter-spacing: .08em; opacity: .85; }
  .tile .t { position: relative; margin-top: 10px; font-size: 21px; font-weight: 850; line-height: 1.32; letter-spacing: -.02em; word-break: keep-all; }
  .tile .k { position: relative; margin-top: 12px; font-size: 13px; font-weight: 700; opacity: .8; }
  .tile.weekly .d::after { content: " · 주간"; }
  #more { display: block; margin: 8px auto 0; padding: 12px 22px; border-radius: 999px; border: 1px solid var(--line); color: var(--dim); }
  .note { color: var(--dim); font-size: 14px; padding: 30px 6px; text-align: center; }

  /* ── 넘겨 보기 ── */
  #story { position: fixed; inset: 0; display: none; background: #000; }
  #story.on { display: block; }
  #track { position: absolute; inset: 0; display: flex; overflow-x: auto; overflow-y: hidden; scroll-snap-type: x mandatory; scrollbar-width: none; }
  #track::-webkit-scrollbar { display: none; }
  .card { flex: 0 0 100%; height: 100%; scroll-snap-align: center; scroll-snap-stop: always; position: relative; overflow: hidden;
    padding: calc(env(safe-area-inset-top) + 64px) 26px calc(env(safe-area-inset-bottom) + 92px); display: flex; flex-direction: column; justify-content: center;
    background: radial-gradient(120% 80% at 85% 0%, var(--c2) 0%, transparent 60%), linear-gradient(160deg, var(--c1) 0%, #0b0d12 78%); }
  .card .inner { max-width: 640px; width: 100%; margin: 0 auto; position: relative; overflow-y: auto; max-height: 100%; scrollbar-width: none; }
  .card .inner::-webkit-scrollbar { display: none; }
  .bigbg { position: absolute; right: -4%; bottom: 6%; font-size: min(42vw, 280px); font-weight: 900; letter-spacing: -.07em; line-height: .8; color: rgba(255,255,255,.07); pointer-events: none; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 18px; }
  .chip { display: inline-block; padding: 5px 11px; border-radius: 999px; font-size: 12px; font-weight: 800; letter-spacing: .04em; background: rgba(255,255,255,.14); }
  .chip.hot { background: #ff3b3b; } .chip.new { background: #2f80ff; } .chip.pick { background: #8b5cf6; } .chip.update { background: #f59e0b; color: #111; }
  .card h2 { margin: 0; font-size: clamp(26px, 7.4vw, 40px); font-weight: 900; line-height: 1.28; letter-spacing: -.03em; word-break: keep-all; }
  .card .en { margin-top: 12px; font-size: 14px; color: rgba(255,255,255,.62); line-height: 1.45; }
  .card .sum { margin-top: 22px; font-size: clamp(16px, 4.3vw, 19px); line-height: 1.72; color: rgba(255,255,255,.9); word-break: keep-all; }
  .card .pickbox { margin-top: 20px; padding: 14px 16px; border-radius: 14px; background: rgba(139,92,246,.22); border: 1px solid rgba(167,139,250,.45); font-size: 14.5px; line-height: 1.6; }
  .card .pickbox b { display: block; font-size: 12px; letter-spacing: .08em; color: #c4b5fd; margin-bottom: 4px; }
  .card .tl { margin-top: 18px; padding-left: 14px; border-left: 2px solid rgba(255,255,255,.25); font-size: 14px; line-height: 1.7; color: rgba(255,255,255,.82); }
  .card .src { margin-top: 24px; display: flex; flex-wrap: wrap; align-items: center; gap: 12px; font-size: 13px; color: rgba(255,255,255,.65); }
  .card .go { display: inline-block; padding: 10px 16px; border-radius: 12px; background: #fff; color: #0b0d12; font-weight: 800; text-decoration: none; font-size: 14px; }
  .cover h2 { font-size: clamp(30px, 8.6vw, 48px); }
  .cover .line { display: block; }
  .cover .date { font-size: 14px; font-weight: 800; letter-spacing: .12em; color: rgba(255,255,255,.75); margin-bottom: 16px; }
  .cover .hint { margin-top: 28px; font-size: 13px; color: rgba(255,255,255,.55); }
  .outro h2 { font-size: clamp(28px, 8vw, 42px); }
  .outro .btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 26px; }
  .outro .btns button, .outro .btns a { padding: 15px 10px; border-radius: 14px; background: rgba(255,255,255,.12); font-weight: 800; text-align: center; text-decoration: none; }
  .outro .btns .main { grid-column: 1 / -1; background: #fff; color: #0b0d12; }

  /* 위: 진행 막대 · 닫기 / 아래: 위치 */
  #bar { position: absolute; left: 0; right: 0; top: 0; padding: calc(env(safe-area-inset-top) + 10px) 14px 0; z-index: 3; pointer-events: none; }
  #prog { display: flex; gap: 3px; }
  #prog i { flex: 1; height: 3px; border-radius: 2px; background: rgba(255,255,255,.25); }
  #prog i.done { background: #fff; }
  #top { display: flex; align-items: center; justify-content: space-between; margin-top: 10px; pointer-events: auto; }
  #top button { padding: 8px 12px; border-radius: 999px; background: rgba(0,0,0,.35); font-size: 14px; font-weight: 700; }
  #top .d { font-size: 13px; font-weight: 800; letter-spacing: .06em; opacity: .85; }
  #pos { position: absolute; left: 0; right: 0; bottom: calc(env(safe-area-inset-bottom) + 18px); text-align: center; z-index: 3; font-size: 13px; font-weight: 800; letter-spacing: .1em; color: rgba(255,255,255,.7); pointer-events: none; }
  /* 화면 양 끝을 누르면 앞뒤로 (가운데는 글 읽기·스크롤) */
  .tap { position: absolute; top: 90px; bottom: 70px; width: 18%; z-index: 2; }
  .tap.l { left: 0; } .tap.r { right: 0; }
</style>
</head>
<body>
<main id="list">
  <div class="brand"><h1>JFNB <b>카드뉴스</b></h1><a href="../index.html">브리핑 사이트 →</a></div>
  <button id="install" type="button">📲 이 화면을 앱으로 설치</button>
  <div id="tiles"><p class="note">불러오는 중…</p></div>
  <button id="more" type="button" hidden>더 보기</button>
</main>

<section id="story" aria-label="카드뉴스 넘겨 보기">
  <div id="track"></div>
  <div class="tap l" aria-hidden="true"></div><div class="tap r" aria-hidden="true"></div>
  <div id="bar"><div id="prog"></div><div id="top"><button type="button" id="close">✕ 목록</button><span class="d" id="sdate"></span><span style="width:64px"></span></div></div>
  <div id="pos"></div>
</section>

<script>
(function () {
  'use strict';
  // 섹션마다 색 (배경이 일을 하게)
  var PAL = [
    [/TOP|헤드라인|Headline/i, '#7a1020', '#ff4d4d'],
    [/AI|기술|테크/i, '#0f2a6b', '#3b82f6'],
    [/경제|금융|시장/i, '#0b4d3a', '#10b981'],
    [/정책|규제|법/i, '#3b1d6e', '#a855f7'],
    [/하드웨어|반도체|기타/i, '#6b3a0b', '#f59e0b'],
    [/Pick|선정|추천/i, '#2e1065', '#8b5cf6'],
    [/주간|스토리|타임라인/i, '#0c3a4a', '#06b6d4'],
  ];
  var DEF = ['#1f2937', '#64748b'];
  function colorOf(sec) { for (var i = 0; i < PAL.length; i++) if (PAL[i][0].test(sec || '')) return [PAL[i][1], PAL[i][2]]; return DEF; }
  var TILE = [['#7a1020', '#ff4d4d'], ['#0f2a6b', '#3b82f6'], ['#0b4d3a', '#10b981'], ['#3b1d6e', '#a855f7'], ['#6b3a0b', '#f59e0b'], ['#0c3a4a', '#06b6d4']];

  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  var clean = function (t) { return String(t || '').replace(/\s*\|\s*(Jae's Briefing|주간 외신 브리핑)\s*$/i, '').trim(); };
  var WD = ['일', '월', '화', '수', '목', '금', '토'];

  var items = [], shown = 0, PAGE = 20;

  // ── 목록 ──
  function loadList() {
    fetch('../list.json?v=' + Math.floor(Date.now() / 300000)).then(function (r) { return r.json(); }).then(function (list) {
      items = list.filter(function (x) { return /^(weekly[-_])?\d{4}-\d{2}-\d{2}$/.test(x.date || '') && x.link; })
        .map(function (x) {
          var iso = x.date.replace(/^weekly[-_]/, '');
          return { id: x.date, iso: iso, weekly: iso !== x.date, title: clean(x.title), file: '../archive/' + x.link.split('/').pop() };
        })
        .sort(function (a, b) { return b.iso.localeCompare(a.iso) || (b.weekly ? 1 : 0) - (a.weekly ? 1 : 0); });
      $('tiles').innerHTML = '';
      shown = 0; more();
      route();
    }).catch(function () { $('tiles').innerHTML = '<p class="note">목록을 불러오지 못했습니다.</p>'; });
  }
  function more() {
    var html = '';
    items.slice(shown, shown + PAGE).forEach(function (x, i) {
      var c = TILE[(shown + i) % TILE.length], d = new Date(x.iso + 'T00:00:00Z');
      var parts = x.title.split(' | ');
      html += '<button class="tile' + (x.weekly ? ' weekly' : '') + '" style="--c1:' + c[0] + ';--c2:' + c[1] + '" data-id="' + esc(x.id) + '">' +
        '<span class="num">' + x.iso.slice(8, 10) + '</span>' +
        '<div class="d">' + x.iso.slice(5, 7) + '.' + x.iso.slice(8, 10) + ' ' + WD[d.getUTCDay()] + '</div>' +
        '<div class="t">' + esc(parts[0]) + '</div>' +
        (parts.length > 1 ? '<div class="k">+ ' + esc(parts.slice(1).join(' · ')) + '</div>' : '') + '</button>';
    });
    $('tiles').insertAdjacentHTML('beforeend', html);
    shown += PAGE;
    $('more').hidden = shown >= items.length;
  }
  $('more').addEventListener('click', more);
  $('tiles').addEventListener('click', function (e) {
    var t = e.target.closest('.tile');
    if (t) openDay(t.getAttribute('data-id'), 0, true);
  });

  // ── 브리핑 HTML → 카드 ──
  function parseDay(html) {
    var doc = new DOMParser().parseFromString(html, 'text/html');
    var txt = function (el) { return el ? el.textContent.replace(/\s+/g, ' ').trim() : ''; };
    var out = {
      title: txt(doc.querySelector('header h1, .header h1')),
      date: txt(doc.querySelector('.date-badge, header .date, header .period')),
      summary: txt(doc.querySelector('header .summary')),
      cards: [],
    };
    doc.querySelectorAll('.jfnb-card').forEach(function (c) {
      var sec = '', p = c.closest('section');
      if (p) sec = txt(p.querySelector('h2')).replace(/^[^\p{L}\p{N}]+/u, '');
      var kr = txt(c.querySelector('.article-title-kr')), h3 = txt(c.querySelector('h3'));
      var badges = [];
      c.querySelectorAll('.badge').forEach(function (b) { var v = txt(b).replace(/^[^\p{L}\p{N}]+/u, ''); if (v && !/^Score/i.test(v)) badges.push(v); });
      var tl = [];
      c.querySelectorAll('.timeline-item').forEach(function (li) { tl.push(txt(li)); });
      var plain = [];
      c.querySelectorAll(':scope > p:not([class]), .status-box p').forEach(function (pp) { plain.push(txt(pp)); });
      out.cards.push({
        sec: sec, kr: kr || h3, en: kr ? h3 : '',
        sum: txt(c.querySelector('.article-summary')) || plain.join(' '),
        src: txt(c.querySelector('.source, .source-link')),
        pick: txt(c.querySelector('.pick-reason')).replace(/^선정 이유:\s*/, ''),
        meta: Array.prototype.map.call(c.querySelectorAll('.meta span'), txt).filter(Boolean).slice(0, 4),
        tl: tl.slice(0, 6), badges: badges.slice(0, 3),
        url: c.getAttribute('data-card-url') || (c.querySelector('a[href^="http"]') || {}).href || '',
      });
    });
    return out;
  }

  var cur = null;   // { idx, day, n }
  function openDay(id, at, push) {
    var idx = items.findIndex(function (x) { return x.id === id; });
    if (idx < 0) return;
    var it = items[idx];
    $('track').innerHTML = '<article class="card" style="--c1:#111827;--c2:#374151"><div class="inner"><p class="note">불러오는 중…</p></div></article>';
    $('story').classList.add('on'); document.body.style.overflow = 'hidden';
    $('sdate').textContent = it.iso.slice(5).replace('-', '.') + (it.weekly ? ' 주간' : '');
    if (push) history.pushState({ day: id }, '', '#' + id);
    fetch(it.file).then(function (r) { if (!r.ok) throw 0; return r.text(); }).then(function (html) {
      var d = parseDay(html);
      render(idx, d, at || 0);
    }).catch(function () {
      $('track').innerHTML = '<article class="card" style="--c1:#111827;--c2:#374151"><div class="inner"><h2>이 날은 카드로 바꿀 수 없어요</h2><div class="src"><a class="go" href="' + esc(it.file) + '">사이트에서 보기 →</a></div></div></article>';
    });
  }

  function render(idx, d, at) {
    var it = items[idx], h = '', dd = new Date(it.iso + 'T00:00:00Z');
    var head = (d.title || it.title).split(/\s*\|\s*/);
    // 표지
    h += '<article class="card cover" style="--c1:#7a1020;--c2:#ff4d4d"><span class="bigbg">' + it.iso.slice(5, 7) + '.' + it.iso.slice(8, 10) + '</span><div class="inner">' +
      '<div class="date">' + esc(d.date || (it.iso + ' ' + WD[dd.getUTCDay()] + '요일')) + (it.weekly ? ' · 주간' : '') + '</div>' +
      '<h2>' + head.map(function (x) { return '<span class="line">' + esc(x) + '</span>'; }).join('') + '</h2>' +
      (d.summary ? '<p class="sum">' + esc(d.summary) + '</p>' : '') +
      '<p class="hint">옆으로 넘겨 보세요 · 기사 ' + d.cards.length + '개 →</p></div></article>';
    // 기사
    d.cards.forEach(function (c) {
      var col = colorOf(c.sec);
      var chips = (c.sec ? '<span class="chip">' + esc(c.sec) + '</span>' : '') + c.badges.map(function (b) {
        var k = /HOT/i.test(b) ? 'hot' : /NEW/i.test(b) ? 'new' : /PICK/i.test(b) ? 'pick' : /UPDATE/i.test(b) ? 'update' : '';
        return '<span class="chip ' + k + '">' + esc(b) + '</span>';
      }).join('');
      h += '<article class="card" style="--c1:' + col[0] + ';--c2:' + col[1] + '"><div class="inner">' +
        '<div class="chips">' + chips + '</div>' +
        '<h2>' + esc(c.kr) + '</h2>' + (c.en ? '<p class="en">' + esc(c.en) + '</p>' : '') +
        (c.meta.length ? '<p class="en">' + esc(c.meta.join(' · ')) + '</p>' : '') +
        (c.sum ? '<p class="sum">' + esc(c.sum) + '</p>' : '') +
        (c.pick ? '<div class="pickbox"><b>선정 이유</b>' + esc(c.pick) + '</div>' : '') +
        (c.tl.length ? '<div class="tl">' + c.tl.map(esc).join('<br>') + '</div>' : '') +
        '<div class="src">' + (c.src ? '<span>' + esc(c.src) + '</span>' : '') + (c.url ? '<a class="go" href="' + esc(c.url) + '" target="_blank" rel="noopener">원문 보기 →</a>' : '') + '</div>' +
        '</div></article>';
    });
    // 끝
    var prev = items[idx + 1], next = items[idx - 1];
    h += '<article class="card outro" style="--c1:#0b4d3a;--c2:#10b981"><div class="inner"><h2>오늘 브리핑 끝 👏</h2>' +
      '<p class="sum">' + esc(it.iso.slice(5).replace('-', '.')) + ' 브리핑 기사 ' + d.cards.length + '개를 다 봤어요.</p><div class="btns">' +
      (next ? '<button type="button" data-go="' + esc(next.id) + '">다음 날 →</button>' : '<button type="button" disabled style="opacity:.35">최신이에요</button>') +
      (prev ? '<button type="button" data-go="' + esc(prev.id) + '">← 전날</button>' : '<button type="button" disabled style="opacity:.35">처음이에요</button>') +
      '<a class="main" href="' + esc(it.file) + '">사이트에서 자세히 보기</a></div></div></article>';

    var track = $('track');
    track.innerHTML = h;
    cur = { idx: idx, n: d.cards.length + 2 };
    $('prog').innerHTML = new Array(cur.n + 1).join('<i></i>');
    track.scrollLeft = 0;
    goto(Math.min(at, cur.n - 1), false);
    update();
  }

  function index() { var t = $('track'); return Math.round(t.scrollLeft / Math.max(1, t.clientWidth)); }
  function goto(i, smooth) { var t = $('track'); t.scrollTo({ left: i * t.clientWidth, behavior: smooth ? 'smooth' : 'auto' }); }
  function update() {
    if (!cur) return;
    var i = index();
    $('pos').textContent = String(i + 1).padStart(2, '0') + ' · ' + String(cur.n).padStart(2, '0');
    Array.prototype.forEach.call($('prog').children, function (el, k) { el.classList.toggle('done', k <= i); });
    try { localStorage.setItem('jfnb-cards-last', items[cur.idx].id + '/' + i); } catch (e) {}
  }
  var raf = 0;
  $('track').addEventListener('scroll', function () { cancelAnimationFrame(raf); raf = requestAnimationFrame(update); });
  document.querySelector('.tap.l').addEventListener('click', function () { goto(Math.max(0, index() - 1), true); });
  document.querySelector('.tap.r').addEventListener('click', function () { if (cur) goto(Math.min(cur.n - 1, index() + 1), true); });
  $('track').addEventListener('click', function (e) {
    var b = e.target.closest('[data-go]');
    if (b) openDay(b.getAttribute('data-go'), 0, true);
  });
  document.addEventListener('keydown', function (e) {
    if (!$('story').classList.contains('on')) return;
    if (e.key === 'ArrowRight') goto(Math.min(cur.n - 1, index() + 1), true);
    else if (e.key === 'ArrowLeft') goto(Math.max(0, index() - 1), true);
    else if (e.key === 'Escape') closeStory(true);
  });
  function closeStory(back) {
    $('story').classList.remove('on'); document.body.style.overflow = ''; cur = null;
    if (back && location.hash) history.back();
  }
  $('close').addEventListener('click', function () { closeStory(true); });
  window.addEventListener('resize', function () { if (cur) goto(index(), false); });

  // 주소의 #날짜 로 바로 열기 · 뒤로 가기
  function route() {
    var id = decodeURIComponent(location.hash.slice(1));
    if (id && items.some(function (x) { return x.id === id; })) openDay(id, 0, false);
    else if ($('story').classList.contains('on')) closeStory(false);
  }
  window.addEventListener('popstate', route);

  // 앱 설치 버튼 (안드로이드 크롬이 설치 가능하다고 알려 줄 때만 보인다)
  var deferred = null;
  window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); deferred = e; $('install').style.display = 'block'; });
  $('install').addEventListener('click', function () { if (!deferred) return; deferred.prompt(); deferred = null; $('install').style.display = 'none'; });

  loadList();
})();
</script>
</body>
</html>
