name: Deep Summary Generate

# 📖 상세 해설 자동 생성 — deep/{날짜}.json 만 커밋한다.
#
# 트리거를 sync-drive 완료 뒤로 잡은 이유
#   .jfnb-card / data-card-url 은 원본 HTML에 없다. 배포 파이프라인의
#   post_process.py 가 빌드 타임에 넣는다. 그러므로 발행 push 직후가 아니라
#   "Sync from Google Drive" 가 끝나고 봇 커밋이 올라온 뒤에 돌아야 한다.
#
# 무한루프 없음
#   이 워크플로는 deep/** 만 커밋한다. sync-drive 의 push 트리거 경로는
#   archive/** 와 data/** 뿐이라 서로를 부르지 않는다.
#
# 한도
#   Gemini 무료 등급 Flash 20 RPD. DEEP_MAX_REQUESTS 로 상한을 두고,
#   이미 deep/{날짜}.json 이 있는 날짜는 아예 건너뛴다.

on:
  workflow_run:
    workflows: ["Sync from Google Drive"]
    types: [completed]
  workflow_dispatch:
    inputs:
      date:
        description: '특정 날짜만 (YYYY-MM-DD). 비우면 해설 없는 최신 날짜 1개'
        required: false
        default: ''
      batch:
        description: '한 요청에 묶을 기사 수 (2 권장 — 4에서 문단 오배분 사고)'
        required: false
        default: '2'
      max_requests:
        description: 'Gemini 호출 상한 (무료 Flash 20 RPD)'
        required: false
        default: '18'
      dry_run:
        description: '1이면 Gemini 호출 없이 파이프라인만 점검'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: deep-generate
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # workflow_run 은 sync 가 성공했을 때만
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.event.workflow_run.head_branch || github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install --quiet requests beautifulsoup4 trafilatura lxml

      - name: Generate deep summaries
        env:
          GEMINI_API_KEY:     ${{ secrets.GEMINI_API_KEY }}
          DEEP_DATE:          ${{ github.event.inputs.date }}
          DEEP_BATCH:         ${{ github.event.inputs.batch || '2' }}
          DEEP_MAX_REQUESTS:  ${{ github.event.inputs.max_requests || '18' }}
          DEEP_DRY_RUN:       ${{ github.event.inputs.dry_run }}
        run: python scripts/deep_generate.py

      - name: Commit deep/
        if: ${{ github.event.inputs.dry_run != '1' }}
        run: |
          git config user.name  "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add deep/
          if git diff --staged --quiet; then
            echo "새로 만들어진 해설이 없다 — 커밋 생략"
          else
            git commit -m "상세 해설 자동 생성 - $(date +'%Y-%m-%d %H:%M') UTC"
            git pull --rebase --autostash
            git push
          fi

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deep-generate-report
          path: out/
          retention-days: 14
